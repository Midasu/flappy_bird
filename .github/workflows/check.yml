name: Run VLESS Checker

on:
  schedule:
    # Запуск каждые 6 часов (минуты, часы, день, месяц, день недели в UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Позволяет запускать проверку вручную кнопкой

permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка кода (Checkout)
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск чекера
        run: python check_and_save.py

      - name: Сохранение результатов в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Закоммитить изменения, если они есть
          git diff-index --quiet HEAD || git commit -m "auto: update vless keys [skip ci]"
          git push
